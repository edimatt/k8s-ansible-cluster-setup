---
- name: Install Cilium CLI
  hosts: k8s_control_plane
  become: true
  gather_facts: true

  vars:
    cilium_cli_install_dir: /usr/local/bin
    cilium_cli_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"

  tasks:
    - name: Get latest stable Cilium CLI version
      ansible.builtin.uri:
        url: https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt
        return_content: true
      register: cilium_cli_version_response

    - name: Set Cilium CLI version
      ansible.builtin.set_fact:
        cilium_cli_version: "{{ cilium_cli_version_response.content | trim }}"

    - name: Show selected Cilium CLI version
      ansible.builtin.debug:
        msg: "Installing Cilium CLI {{ cilium_cli_version }} for linux-{{ cilium_cli_arch }}"

    - name: Download Cilium CLI archive
      ansible.builtin.get_url:
        url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-{{ cilium_cli_arch }}.tar.gz"
        dest: "/tmp/cilium-linux-{{ cilium_cli_arch }}.tar.gz"
        mode: '0644'

    - name: Extract Cilium CLI
      ansible.builtin.unarchive:
        src: "/tmp/cilium-linux-{{ cilium_cli_arch }}.tar.gz"
        dest: "{{ cilium_cli_install_dir }}"
        remote_src: true
        owner: root
        group: root
        mode: '0755'
        creates: "{{ cilium_cli_install_dir }}/cilium"

    - name: Check Cilium CLI version
      ansible.builtin.command: cilium version --client
      register: cilium_cli_check
      changed_when: false

    - name: Show Cilium CLI version
      ansible.builtin.debug:
        var: cilium_cli_check.stdout
