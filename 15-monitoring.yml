---
- name: Install minimal Kubernetes monitoring stack
  hosts: k8s_control_plane
  become: true
  gather_facts: false

  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf

    monitoring_namespace: monitoring
    monitoring_release_name: kube-prometheus-stack
    monitoring_chart_repo_name: prometheus-community
    monitoring_chart_repo_url: https://prometheus-community.github.io/helm-charts
    monitoring_chart_ref: prometheus-community/kube-prometheus-stack
    monitoring_chart_version: "84.3.0"
    monitoring_helm_timeout: 20m

    grafana_admin_password: admin

    monitoring_crds:
      - alertmanagerconfigs.monitoring.coreos.com
      - alertmanagers.monitoring.coreos.com
      - podmonitors.monitoring.coreos.com
      - probes.monitoring.coreos.com
      - prometheusagents.monitoring.coreos.com
      - prometheuses.monitoring.coreos.com
      - prometheusrules.monitoring.coreos.com
      - scrapeconfigs.monitoring.coreos.com
      - servicemonitors.monitoring.coreos.com
      - thanosrulers.monitoring.coreos.com

    monitoring_deployments:
      - kube-prometheus-stack-grafana
      - kube-prometheus-stack-kube-state-metrics
      - kube-prometheus-stack-operator

    monitoring_statefulsets:
      - alertmanager-kube-prometheus-stack-alertmanager
      - prometheus-kube-prometheus-stack-prometheus

    monitoring_daemonsets:
      - kube-prometheus-stack-prometheus-node-exporter

  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    NO_COLOR: "1"

  tasks:
    - name: Create monitoring namespace
      ansible.builtin.command: >
        kubectl create namespace {{ monitoring_namespace }}
      register: monitoring_namespace_create
      changed_when: "'created' in monitoring_namespace_create.stdout"
      failed_when:
        - monitoring_namespace_create.rc != 0
        - "'AlreadyExists' not in monitoring_namespace_create.stderr"

    - name: Add Prometheus community Helm repository
      ansible.builtin.command: >
        helm repo add {{ monitoring_chart_repo_name }} {{ monitoring_chart_repo_url }}
      register: monitoring_repo_add
      changed_when: "'has been added' in monitoring_repo_add.stdout"
      failed_when:
        - monitoring_repo_add.rc != 0
        - "'already exists' not in monitoring_repo_add.stderr"

    - name: Update Helm repositories
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Write kube-prometheus-stack values
      ansible.builtin.copy:
        dest: /tmp/kube-prometheus-stack-values.yml
        owner: root
        group: root
        mode: '0600'
        content: |
          grafana:
            enabled: true
            adminPassword: "{{ grafana_admin_password }}"
            service:
              type: ClusterIP
            startupProbe:
              enabled: true
              path: /api/health
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 60
            readinessProbe:
              httpGet:
                path: /api/health
                port: 3000
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 12
            livenessProbe:
              httpGet:
                path: /api/health
                port: 3000
              initialDelaySeconds: 90
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 12

          prometheus:
            prometheusSpec:
              retention: 2d
              storageSpec: {}

          alertmanager:
            enabled: true
            alertmanagerSpec:
              storage: {}

          prometheusOperator:
            admissionWebhooks:
              enabled: true

          kubeStateMetrics:
            enabled: true

          nodeExporter:
            enabled: true

    - name: Check current monitoring Helm release status
      ansible.builtin.command: >
        helm status {{ monitoring_release_name }} -n {{ monitoring_namespace }}
      register: monitoring_helm_status_before
      changed_when: false
      failed_when: false

    - name: Remove stale failed or pending monitoring Helm release
      ansible.builtin.command: >
        helm uninstall {{ monitoring_release_name }} -n {{ monitoring_namespace }} --wait
      register: monitoring_release_cleanup
      changed_when: monitoring_release_cleanup.rc == 0
      when:
        - monitoring_helm_status_before.rc == 0
        - "'STATUS: failed' in monitoring_helm_status_before.stdout or 'STATUS: pending-' in monitoring_helm_status_before.stdout"

    # NOTE:
    # helm upgrade --install may report "upgraded" even when rendered manifests are unchanged.
    # This is acceptable for now because Helm is the desired release manager for the monitoring stack.
    # For stricter idempotency later, replace this command with kubernetes.core.helm or helm diff logic.
    - name: Install or upgrade kube-prometheus-stack with Helm
      ansible.builtin.command: >
        helm upgrade --install {{ monitoring_release_name }}
        {{ monitoring_chart_ref }}
        --namespace {{ monitoring_namespace }}
        --version {{ monitoring_chart_version }}
        --values /tmp/kube-prometheus-stack-values.yml
        --wait
        --wait-for-jobs
        --timeout {{ monitoring_helm_timeout }}
      register: monitoring_helm_install
      retries: 2
      delay: 15
      until: monitoring_helm_install.rc == 0
      changed_when: >
        'has been upgraded' in monitoring_helm_install.stdout or
        'has been installed' in monitoring_helm_install.stdout

    - name: Wait for monitoring CRDs to be established
      ansible.builtin.command: >
        kubectl wait --for=condition=Established crd/{{ item }} --timeout=180s
      loop: "{{ monitoring_crds }}"
      register: monitoring_crds_established
      changed_when: false

    - name: Wait for monitoring Deployments
      ansible.builtin.command: >
        kubectl -n {{ monitoring_namespace }}
        rollout status deployment/{{ item }} --timeout=300s
      loop: "{{ monitoring_deployments }}"
      register: monitoring_deployment_rollouts
      changed_when: false

    - name: Wait for monitoring StatefulSets
      ansible.builtin.command: >
        kubectl -n {{ monitoring_namespace }}
        rollout status statefulset/{{ item }} --timeout=300s
      loop: "{{ monitoring_statefulsets }}"
      register: monitoring_statefulset_rollouts
      changed_when: false

    - name: Wait for monitoring DaemonSets
      ansible.builtin.command: >
        kubectl -n {{ monitoring_namespace }}
        rollout status daemonset/{{ item }} --timeout=300s
      loop: "{{ monitoring_daemonsets }}"
      register: monitoring_daemonset_rollouts
      changed_when: false

    - name: Show Helm release
      ansible.builtin.command: >
        helm status {{ monitoring_release_name }} -n {{ monitoring_namespace }}
      register: monitoring_helm_status
      changed_when: false

    - name: Show monitoring pods
      ansible.builtin.command: >
        kubectl -n {{ monitoring_namespace }} get pods -o wide
      register: monitoring_pods
      changed_when: false

    - name: Show monitoring services
      ansible.builtin.command: >
        kubectl -n {{ monitoring_namespace }} get svc -o wide
      register: monitoring_services
      changed_when: false

    - name: Show monitoring CRDs
      ansible.builtin.command: >
        kubectl get crd {{ monitoring_crds | join(' ') }}
      register: monitoring_crds_status
      changed_when: false

    - name: Show ServiceMonitors
      ansible.builtin.command: >
        kubectl get servicemonitors.monitoring.coreos.com -A
      register: monitoring_servicemonitors
      changed_when: false

    - name: Show Prometheus and Alertmanager resources
      ansible.builtin.command: >
        kubectl -n {{ monitoring_namespace }} get prometheus,alertmanager
      register: monitoring_prometheus_resources
      changed_when: false

    - name: Print monitoring status
      ansible.builtin.debug:
        msg:
          - "{{ monitoring_helm_status.stdout_lines }}"
          - "{{ monitoring_pods.stdout_lines }}"
          - "{{ monitoring_services.stdout_lines }}"
          - "{{ monitoring_crds_status.stdout_lines }}"
          - "{{ monitoring_servicemonitors.stdout_lines }}"
          - "{{ monitoring_prometheus_resources.stdout_lines }}"
