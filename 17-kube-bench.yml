---
- name: Install kube-bench on Kubernetes nodes
  hosts: k8s_cluster
  become: true
  gather_facts: true

  vars:
    kube_bench_version: "0.15.5"
    kube_bench_release_base_url: "https://github.com/aquasecurity/kube-bench/releases/download/v{{ kube_bench_version }}"
    kube_bench_arch_map:
      x86_64: amd64
      aarch64: arm64
      arm64: arm64
    kube_bench_checksums:
      amd64: 74edba8d7b9eb2f6e7109f50595cfcd5eaf2dd61061629006c17ffa9c5281922
      arm64: 01c97c21278531ee0d02328bc8372d0ae4b0e86ac0100a41be54bf8232df4ff5
    kube_bench_arch: "{{ kube_bench_arch_map.get(ansible_facts['architecture'], '') }}"
    kube_bench_deb_name: "kube-bench_{{ kube_bench_version }}_linux_{{ kube_bench_arch }}.deb"
    kube_bench_deb_path: "/tmp/{{ kube_bench_deb_name }}"
    kube_bench_config_path: /etc/kube-bench/cfg/config.yaml

  tasks:
    - name: Validate supported CPU architecture
      ansible.builtin.assert:
        that:
          - kube_bench_arch | length > 0
          - kube_bench_checksums[kube_bench_arch] is defined
        fail_msg: "Unsupported kube-bench architecture: {{ ansible_facts['architecture'] }}"

    - name: Check installed kube-bench package version
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - -f=${Version}
          - kube-bench
      register: kube_bench_installed_version
      changed_when: false
      failed_when: false

    - name: Download kube-bench Debian package
      ansible.builtin.get_url:
        url: "{{ kube_bench_release_base_url }}/{{ kube_bench_deb_name }}"
        dest: "{{ kube_bench_deb_path }}"
        owner: root
        group: root
        mode: '0644'
        checksum: "sha256:{{ kube_bench_checksums[kube_bench_arch] }}"
      when:
        - kube_bench_installed_version.stdout | trim != kube_bench_version
        - not ansible_check_mode

    - name: Install kube-bench Debian package
      ansible.builtin.apt:
        deb: "{{ kube_bench_deb_path }}"
        state: present
      when:
        - kube_bench_installed_version.stdout | trim != kube_bench_version
        - not ansible_check_mode

    - name: Verify kube-bench binary
      ansible.builtin.command:
        argv:
          - kube-bench
          - --help
      register: kube_bench_help_output
      changed_when: false
      when: not ansible_check_mode

    - name: Verify kube-bench configuration is installed
      ansible.builtin.stat:
        path: "{{ kube_bench_config_path }}"
      register: kube_bench_config
      failed_when: not kube_bench_config.stat.exists
      when: not ansible_check_mode

    - name: Report kube-bench check mode action
      ansible.builtin.debug:
        msg: "kube-bench {{ kube_bench_version }} would be installed on {{ inventory_hostname }}"
      changed_when: true
      when:
        - ansible_check_mode
        - kube_bench_installed_version.stdout | trim != kube_bench_version

    - name: Print kube-bench status
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Version: {{ kube_bench_version }}"
          - "Config: {{ kube_bench_config_path }}"
      when:
        - kube_bench_help_output is defined
        - kube_bench_help_output is not skipped
