---
- name: Install Kubernetes packages
  hosts: k8s_cluster
  become: true
  gather_facts: true

  vars:
    kubernetes_minor_version: "v1.35"
    kubernetes_apt_keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    kubernetes_apt_repo_file: /etc/apt/sources.list.d/kubernetes.list

  tasks:
    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download Kubernetes apt Release key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key"
        dest: /tmp/kubernetes-release.key
        mode: '0644'

    - name: Dearmor Kubernetes apt key
      ansible.builtin.command:
        cmd: "gpg --dearmor -o {{ kubernetes_apt_keyring }} /tmp/kubernetes-release.key"
        creates: "{{ kubernetes_apt_keyring }}"

    - name: Configure Kubernetes apt repository
      ansible.builtin.copy:
        dest: "{{ kubernetes_apt_repo_file }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          deb [signed-by={{ kubernetes_apt_keyring }}] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/ /

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install kubelet, kubeadm, kubectl
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

    - name: Show kubeadm version
      ansible.builtin.command: kubeadm version
      register: kubeadm_version
      changed_when: false

    - name: Show kubectl client version
      ansible.builtin.command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Show versions
      ansible.builtin.debug:
        msg:
          - "{{ kubeadm_version.stdout }}"
          - "{{ kubectl_version.stdout }}"
