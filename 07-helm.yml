---
- name: Install Helm from official binary release
  hosts: k8s_control_plane
  become: true
  gather_facts: true

  vars:
    helm_version: "v4.1.1"
    helm_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    helm_os: linux
    helm_archive: "helm-{{ helm_version }}-{{ helm_os }}-{{ helm_arch }}.tar.gz"
    helm_download_url: "https://get.helm.sh/{{ helm_archive }}"

  tasks:
    - name: Download Helm archive
      ansible.builtin.get_url:
        url: "{{ helm_download_url }}"
        dest: "/tmp/{{ helm_archive }}"
        mode: '0644'

    - name: Extract Helm archive
      ansible.builtin.unarchive:
        src: "/tmp/{{ helm_archive }}"
        dest: /tmp
        remote_src: true

    - name: Install Helm binary
      ansible.builtin.copy:
        src: "/tmp/{{ helm_os }}-{{ helm_arch }}/helm"
        dest: /usr/local/bin/helm
        owner: root
        group: root
        mode: '0755'
        remote_src: true

    - name: Check Helm version
      ansible.builtin.command: helm version --short
      register: helm_version_check
      changed_when: false

    - name: Show Helm version
      ansible.builtin.debug:
        var: helm_version_check.stdout
