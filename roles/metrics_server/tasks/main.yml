---
  - name: Add Metrics Server Helm repository
    ansible.builtin.command: >
      helm repo add {{ metrics_server_repo_name }} {{ metrics_server_repo_url }}
    register: metrics_repo_add
    changed_when: "'has been added' in metrics_repo_add.stdout"
    failed_when:
      - metrics_repo_add.rc != 0
      - "'already exists' not in metrics_repo_add.stderr"

  - name: Update Helm repositories
    ansible.builtin.command: helm repo update
    changed_when: false

  - name: Install or upgrade Metrics Server
    ansible.builtin.command: >
      helm upgrade --install {{ metrics_server_release_name }} {{ metrics_server_chart_ref }}
      --namespace {{ metrics_server_namespace }}
      --kubeconfig {{ kubeconfig_path }}
      --set args="{--kubelet-insecure-tls}"
    register: metrics_server_install
    changed_when: "'has been upgraded' in metrics_server_install.stdout or 'has been installed' in metrics_server_install.stdout"

  - name: Wait for Metrics Server rollout
    ansible.builtin.command: >
      kubectl -n {{ metrics_server_namespace }}
      rollout status deployment/{{ metrics_server_release_name }} --timeout=300s
    register: metrics_server_rollout
    changed_when: false

  - name: Wait for Metrics APIService to be available
    ansible.builtin.command: >
      kubectl wait --for=condition=Available apiservice/v1beta1.metrics.k8s.io --timeout=300s
    register: metrics_api_wait
    changed_when: false

  - name: Show Metrics Server pods
    ansible.builtin.command: >
      kubectl -n {{ metrics_server_namespace }} get pods -l app.kubernetes.io/name=metrics-server -o wide
    register: metrics_server_pods
    changed_when: false

  - name: Try kubectl top nodes
    ansible.builtin.command: kubectl top nodes
    register: top_nodes
    changed_when: false
    retries: 12
    delay: 10
    until: top_nodes.rc == 0

  - name: Print Metrics Server status
    ansible.builtin.debug:
      msg:
        - "{{ metrics_server_pods.stdout_lines }}"
        - "{{ top_nodes.stdout_lines }}"
