---
  - name: Check if worker node is already joined
    ansible.builtin.stat:
      path: /etc/kubernetes/kubelet.conf
    register: worker_kubelet_conf

  - name: Create kubeadm worker join command on control plane
    ansible.builtin.command: kubeadm token create --print-join-command
    delegate_to: "{{ control_plane_host }}"
    run_once: true
    register: kubeadm_worker_join_command
    changed_when: false

  - name: Join worker node to Kubernetes cluster
    ansible.builtin.command: "{{ kubeadm_worker_join_command.stdout }}"
    when: not worker_kubelet_conf.stat.exists
    register: kubeadm_worker_join
    changed_when: true

  - name: Wait for worker node to be registered
    ansible.builtin.command: >
      kubectl get node {{ inventory_hostname }}
    delegate_to: "{{ control_plane_host }}"
    environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
    register: worker_node_registered
    changed_when: false
    retries: 30
    delay: 10
    until: worker_node_registered.rc == 0

  - name: Label worker node role
    ansible.builtin.command: >
      kubectl label node {{ inventory_hostname }}
      node-role.kubernetes.io/worker=
      --overwrite
    delegate_to: "{{ control_plane_host }}"
    environment:
      KUBECONFIG: "{{ kubeconfig_path }}"
    register: worker_node_role_label
    changed_when: "'not labeled' not in worker_node_role_label.stdout"
