---
# Main entry point for the Kubernetes lab.
#
# The roles are deliberately grouped into plays by the hosts they affect. This
# keeps the control-plane/worker lifecycle explicit while allowing Ansible's
# inventory targeting, tags, check mode, and extra vars to do the filtering.

- name: Bootstrap Kubernetes nodes
  hosts: k8s_cluster
  tags: [bootstrap]
  roles:
    - role: sudo_nopass
      become: false
      tags: [sudo]
    - role: preflight
      tags: [preflight]
    - role: os_prep
      tags: [os_prep]
    - role: firewall
      tags: [firewall]
    - role: containerd
      tags: [containerd]
    - role: kubernetes_packages
      tags: [kubernetes]

- name: Initialize Kubernetes control plane
  hosts: k8s_control_plane
  tags: [platform]
  roles:
    - role: kubeadm_control_plane
      tags: [kubeadm, control_plane]

- name: Join Kubernetes workers
  hosts: k8s_workers
  tags: [platform]
  roles:
    - role: kubeadm_worker
      tags: [kubeadm, workers]

- name: Configure the Kubernetes platform
  hosts: k8s_control_plane
  tags: [platform]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    NO_COLOR: "1"
  roles:
    - role: single_node
      tags: [single_node]
    - role: helm
      tags: [helm]
    - role: cilium_cli
      tags: [cilium]
    - role: cilium_platform
      tags: [cilium]
    - role: local_storage
      tags: [storage]
    - role: metrics_server
      tags: [metrics]
    - role: validation
      tags: [validation]
    - role: cert_manager
      tags: [cert_manager]
    - role: nginx_ingress
      tags: [ingress]

- name: Install node security tooling
  hosts: k8s_cluster
  tags: [security]
  roles:
    - role: kube_bench
      tags: [kube_bench]
    - role: trivy
      tags: [trivy]

- name: Install control-plane security controls
  hosts: k8s_control_plane
  tags: [security]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    NO_COLOR: "1"
  roles:
    - role: pod_security_admission
      when: enable_pod_security_admission | bool
      tags: [psa]
    - role: kyverno
      tags: [kyverno]
    - role: falco
      tags: [falco]

- name: Install optional platform operators
  hosts: k8s_control_plane
  tags: [optional]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    NO_COLOR: "1"
  roles:
    - role: spark_operator
      tags: [spark]

- name: Install optional monitoring
  hosts: k8s_control_plane
  tags: [optional]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    NO_COLOR: "1"
  roles:
    - role: monitoring
      when: enable_monitoring | bool
      tags: [monitoring]
