---
- name: Validate Kubernetes cluster
  hosts: k8s_control_plane
  become: true
  gather_facts: false

  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf

  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    NO_COLOR: "1"

  tasks:
    - name: Show nodes
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: Show all pods
      ansible.builtin.command: kubectl get pods -A -o wide
      register: pods
      changed_when: false

    - name: Show Cilium status
      ansible.builtin.command: cilium status --wait=false
      register: cilium_status
      changed_when: false

    - name: Print nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines

    - name: Print pods
      ansible.builtin.debug:
        var: pods.stdout_lines

    - name: Print Cilium status
      ansible.builtin.debug:
        var: cilium_status.stdout_lines
